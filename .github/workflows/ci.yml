name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Postgres, isolation, auth and tenancy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same port the tests default to, so no override is needed on a dev box.
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      BETTER_AUTH_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/db: RLS, least privilege, tenant creation, site keys (26 tests).
      - run: pnpm --filter @webina/db run test

      # apps/web: real Better Auth sign-up/sign-in, then a signed-in owner who
      # can only reach their own tenant.
      - run: pnpm --filter @webina/web run test

      # Build first: it generates src/routeTree.gen.ts, which typecheck needs.
      - run: pnpm run build
      - run: pnpm -r run typecheck
